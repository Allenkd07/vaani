# Render Blueprint: Docker web service and free PostgreSQL.
services:
  - type: web
    name: vaani
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vaani-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: STT_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-transcribe-live
      - key: STT_MODE
        value: VERBATIM

databases:
  - name: vaani-db
    plan: free
